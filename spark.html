<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FAF6EC">
  <title>Ideas — Spark</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <main class="spark-main">
    <div class="spark-eyebrow">Spark</div>
    <h1>Fresh from the wider world</h1>
    <p class="lede">A random pattern people are running. Re-roll until one feels alive. Dig deeper opens a Claude chat already framed up.</p>

    <div id="card"></div>

    <div class="spark-back-row">
      <button class="spark-back-link" id="back-btn" hidden>← Previous spark</button>
    </div>

    <div class="spark-actions">
      <button class="btn primary-fill" id="dig-btn">Dig deeper in chat</button>
      <button class="btn secondary" id="save-btn">Save to my pool</button>
      <button class="btn" id="another-btn">Another spark →</button>
    </div>
  </main>

  <script src="assets/sparks-data.js"></script>
  <script src="assets/app.js"></script>
  <script>
    const PALETTE = {
      hardware: { color: '#f59e0b', colorDeep: '#b45309', label: 'Hardware engineering project' },
      ai:       { color: '#0891b2', colorDeep: '#155e75', label: 'Local-AI build' },
      workflow: { color: '#4f46e5', colorDeep: '#3730a3', label: 'Programmable workflow' },
      app:      { color: '#db2777', colorDeep: '#9d174d', label: 'PWA / app to build' },
      stack:    { color: '#0d9488', colorDeep: '#115e59', label: 'Custom self-host build' },
      life:     { color: '#FF9F3D', colorDeep: '#C97D2A', label: 'Question that points at a build' },
      agent:    { color: '#7c3aed', colorDeep: '#5b21b6', label: 'Agent engineering build' }
    };

    let current = null;
    const history = [];   // previously-shown sparks; newest at end
    const cardEl = document.getElementById('card');
    const backBtn = document.getElementById('back-btn');
    const saveBtn = document.getElementById('save-btn');
    const digBtn = document.getElementById('dig-btn');
    const anotherBtn = document.getElementById('another-btn');

    function availableSparks() {
      return window.SPARKS.filter(s => !TB.isSparkSaved(s.n));
    }

    function paint(spark) {
      current = spark;
      if (!spark) {
        cardEl.innerHTML = `
          <div class="spark-empty">
            <h2>You’ve saved every spark to your pool</h2>
            <p>The deck is empty for now. New batches land in the seed file when fresh research drops.</p>
          </div>`;
        saveBtn.hidden = true;
        digBtn.hidden = true;
        anotherBtn.hidden = true;
        backBtn.hidden = history.length === 0;
        return;
      }
      const p = PALETTE[spark.c] || PALETTE.workflow;
      cardEl.innerHTML = `
        <div class="spark-card" style="--c:${p.color};--cd:${p.colorDeep};">
          <div class="spark-card-eyebrow">${p.label}</div>
          <div class="spark-card-name">${TB.escapeHtml(spark.n)}</div>
          <p class="spark-card-body">${TB.escapeHtml(spark.b)}</p>
        </div>`;
      saveBtn.hidden = false;
      digBtn.hidden = false;
      anotherBtn.hidden = false;
      backBtn.hidden = history.length === 0;
    }

    function roll() {
      const sparks = availableSparks();
      if (!sparks.length) { if (current) history.push(current); paint(null); return; }
      let next;
      do {
        next = sparks[Math.floor(Math.random() * sparks.length)];
      } while (current && sparks.length > 1 && next.n === current.n);
      if (current) history.push(current);
      paint(next);
    }

    function goBack() {
      if (!history.length) return;
      const prev = history.pop();
      paint(prev);
    }

    anotherBtn.addEventListener('click', roll);
    backBtn.addEventListener('click', goBack);

    digBtn.addEventListener('click', () => {
      if (!current) return;
      const prompt = window.buildSparkPrompt(current);
      const url = 'https://claude.ai/new?q=' + encodeURIComponent(prompt);
      navigator.clipboard.writeText(prompt).then(
        () => { TB.toast('Prompt copied. Opening Claude…'); setTimeout(() => window.open(url, '_blank'), 250); },
        () => { fallbackCopy(prompt); window.open(url, '_blank'); }
      );
    });

    saveBtn.addEventListener('click', () => {
      if (!current) return;
      const p = PALETTE[current.c] || PALETTE.workflow;
      const labelMap = { workflow: 'software', stack: 'software', app: 'software', hardware: 'physical', ai: 'software', life: 'software' };
      const idea = {
        id: TB.uid(),
        name: current.n,
        hook: current.b.split(/(?<=[.!?])\s+/)[0].slice(0, 180),
        category: labelMap[current.c] || 'software',
        status: 'Spark — saved for later',
        captured: TB.isoToday(),
        color: p.color,
        colorDeep: p.colorDeep,
        icon: current.c === 'hardware' ? 'router' : (current.c === 'ai' ? 'robot' : 'build'),
        body: current.b
      };
      TB.addUserIdea(idea);
      TB.markSparkSaved(current.n);
      TB.toast('Saved to your pool — next spark…');
      setTimeout(roll, 500);
    });

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); TB.toast('Copied'); } catch {}
      document.body.removeChild(ta);
    }

    // First spark — paint directly so it doesn't push a phantom onto history
    (function init() {
      const sparks = availableSparks();
      if (!sparks.length) { paint(null); return; }
      paint(sparks[Math.floor(Math.random() * sparks.length)]);
    })();
  </script>
</body>
</html>
