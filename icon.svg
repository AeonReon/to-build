<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD64A"/>
      <stop offset="50%" stop-color="#FF9F3D"/>
      <stop offset="100%" stop-color="#FF5E8E"/>
    </linearGradient>
    <linearGradient id="cardShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background rounded square (full bleed; iOS rounds corners itself) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- soft sunburst -->
  <circle cx="120" cy="120" r="180" fill="#ffffff" opacity="0.12"/>
  <circle cx="120" cy="120" r="100" fill="#ffffff" opacity="0.10"/>

  <!-- back card (smallest, tilted left) -->
  <g transform="translate(126 142) rotate(-8 130 70)" filter="url(#shadow)">
    <rect x="0" y="0" width="260" height="140" rx="22" fill="#FFFFFF" opacity="0.78"/>
  </g>

  <!-- middle card -->
  <g transform="translate(118 188)" filter="url(#shadow)">
    <rect x="0" y="0" width="276" height="148" rx="24" fill="#FFFFFF" opacity="0.92"/>
  </g>

  <!-- front card (the active idea card) -->
  <g transform="translate(102 232)" filter="url(#shadow)">
    <rect x="0" y="0" width="308" height="172" rx="28" fill="url(#cardShade)"/>
    <!-- coloured tab on left -->
    <rect x="22" y="28" width="10" height="116" rx="5" fill="#FF5E8E"/>
    <!-- list lines -->
    <rect x="52" y="36" width="180" height="14" rx="6" fill="#2A2038" opacity="0.78"/>
    <rect x="52" y="62" width="220" height="10" rx="5" fill="#2A2038" opacity="0.32"/>
    <rect x="52" y="80" width="200" height="10" rx="5" fill="#2A2038" opacity="0.32"/>
    <rect x="52" y="98" width="170" height="10" rx="5" fill="#2A2038" opacity="0.32"/>
    <!-- check chip bottom right -->
    <circle cx="262" cy="134" r="20" fill="#4CCB9F"/>
    <path d="M252 134 l8 8 l14 -16" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- tiny spark accents at top right -->
  <g transform="translate(380 96)">
    <polygon points="0,-26 6,-6 26,0 6,6 0,26 -6,6 -26,0 -6,-6" fill="#FFFFFF" opacity="0.95"/>
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#FFD64A"/>
  </g>
  <g transform="translate(434 168)">
    <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
